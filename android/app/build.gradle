apply plugin: 'com.android.application'

// --- Version (etapa 8) ----------------------------------------------------------
// Sale de package.json, asi hay un solo lugar donde cambiarla:
//   versionName = "1.2.3"   versionCode = 1*10000 + 2*100 + 3 = 10203
def paquete = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def (mayor, menor, parche) = paquete.version.tokenize('.').collect { it.replaceAll(/\D.*/, '') as int }

// --- Firma de la version release (etapa 8) ---------------------------------------
// La clave de firma NUNCA esta en el repositorio. Se indica con variables de
// entorno o con un archivo de propiedades fuera del repo (ver docs/20-apk-android.md):
//   SINTAXIA_KEYSTORE           ruta al archivo .jks
//   SINTAXIA_KEYSTORE_PASSWORD  contrasena del almacen
//   SINTAXIA_KEY_ALIAS          alias de la clave
//   SINTAXIA_KEY_PASSWORD       contrasena de la clave
//   o SINTAXIA_FIRMA=/ruta/firma.properties con storeFile, storePassword, keyAlias, keyPassword
def firma = new Properties()
def archivoFirma = System.getenv('SINTAXIA_FIRMA')
if (archivoFirma && file(archivoFirma).exists()) {
    file(archivoFirma).withInputStream { firma.load(it) }
}
def datoDeFirma = { String propiedad, String variable -> System.getenv(variable) ?: firma.getProperty(propiedad) }
def almacen = datoDeFirma('storeFile', 'SINTAXIA_KEYSTORE')
def hayFirma = almacen && file(almacen).exists()

android {
    namespace = "com.sintaxia.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sintaxia.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mayor * 10000 + menor * 100 + parche
        versionName paquete.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hayFirma) {
                storeFile file(almacen)
                storePassword datoDeFirma('storePassword', 'SINTAXIA_KEYSTORE_PASSWORD')
                keyAlias datoDeFirma('keyAlias', 'SINTAXIA_KEY_ALIAS')
                keyPassword datoDeFirma('keyPassword', 'SINTAXIA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Sin clave configurada la release sale sin firmar (no se puede instalar).
            if (hayFirma) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
